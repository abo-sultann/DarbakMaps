name: Darbak Maps Expedition Finish

on:
  push:
    paths:
      - 'tools/apply_expedition_finish.py'
      - '.github/workflows/apply-expedition-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply expedition finish
        run: python3 tools/apply_expedition_finish.py

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Commit finished app
        run: |
          git config user.name "Darbak Build Bot"
          git config user.email "actions@github.com"
          git add app/build.gradle \
                  app/src/main/res/values/ids.xml \
                  app/src/main/java/com/abosultan/darbakmaps/BacktrackGuidance.java \
                  app/src/main/java/com/abosultan/darbakmaps/MapRuntimeBridge.java \
                  app/src/main/java/com/abosultan/darbakmaps/map/OfflineMapController.java \
                  app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java \
                  app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          git diff --cached --quiet || git commit -m "feat: finish expedition guidance 0.7.1"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.7.1-final-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
