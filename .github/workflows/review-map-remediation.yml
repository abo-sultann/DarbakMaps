name: Review map remediation

on:
  push:
    branches: [darbakmaps-final-0.8.0]
    paths:
      - '.github/workflows/review-map-remediation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-final-0.8.0
          fetch-depth: 0
      - name: Patch map segment rendering and follow behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/abosultan/darbakmaps/map/OfflineMapController.java')
          s=p.read_text()
          s=s.replace('import android.graphics.RectF;','import android.graphics.RectF;\nimport android.view.MotionEvent;')
          s=s.replace('    private Polyline activeTrack;\n    private Polyline storedTrack;',
'''    private final List<Polyline> activeTrackSegments = new ArrayList<>();
    private final List<Polyline> storedTrackSegments = new ArrayList<>();
    private Polyline activeTrack;
    private int activeTrackPointCount;
    private static final int MAX_ACTIVE_DRAW_POINTS = 4000;
    private boolean followSuspended;''')
          anchor='''        mapView.setClickable(true);\n        mapView.setBuiltInZoomControls(false);'''
          repl='''        mapView.setClickable(true);\n        mapView.setOnTouchListener((view, event) -> {\n            if (event.getActionMasked() == MotionEvent.ACTION_DOWN) followSuspended = true;\n            return false;\n        });\n        mapView.setBuiltInZoomControls(false);'''
          if anchor not in s: raise SystemExit('constructor anchor missing')
          s=s.replace(anchor,repl,1)
          s=s.replace('''        lastLocation = new LatLong(latitude, longitude);\n        lastBearing = normalize(bearing);''',
'''        lastLocation = new LatLong(latitude, longitude);
        boolean bearingValid = !Float.isNaN(bearing) && !Float.isInfinite(bearing);
        if (bearingValid) lastBearing = normalize(bearing);''')
          s=s.replace('''        if (orientationMode == MapUiPreferences.ORIENTATION_HEADING) {\n            int bearingBucket = Math.round(lastBearing / 10f) * 10;''',
'''        if (orientationMode == MapUiPreferences.ORIENTATION_HEADING && bearingValid) {
            int bearingBucket = Math.round(lastBearing / 10f) * 10;''')
          s=s.replace('''        updateLocationMarker(lastLocation, lastBearing);''',
'''        updateLocationMarker(lastLocation, bearingValid ? lastBearing : Float.NaN);''',1)
          s=s.replace('''        if (MapUiPreferences.followVehicle(mapView.getContext()) && centeredOnFirstFix) {''',
'''        if (MapUiPreferences.followVehicle(mapView.getContext()) && !followSuspended && centeredOnFirstFix) {''')
          old='''    private void updateLocationMarker(LatLong position, float bearing) {\n        float screenBearing = normalize(bearing + mapView.getMapRotation().degrees);\n        int bucket = Math.round(screenBearing / 10f) * 10;\n        if (locationMarker == null) {'''
          new='''    private void updateLocationMarker(LatLong position, float bearing) {\n        boolean bearingValid = !Float.isNaN(bearing) && !Float.isInfinite(bearing);\n        float screenBearing = bearingValid ? normalize(bearing + mapView.getMapRotation().degrees) : 0f;\n        int bucket = bearingValid ? Math.round(screenBearing / 10f) * 10 : Integer.MIN_VALUE;\n        if (locationMarker == null) {'''
          if old not in s: raise SystemExit('marker method anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''            locationMarker = new Marker(position, createArrow(bucket), 0, 0);''',
'''            locationMarker = new Marker(position, createArrow(bearingValid ? bucket : 0), 0, 0);''',1)
          s=s.replace('''            if (bucket != lastArrowBucket) {\n                locationMarker.setBitmap(createArrow(bucket));\n                lastArrowBucket = bucket;\n            }''',
'''            if (bearingValid && bucket != lastArrowBucket) {
                locationMarker.setBitmap(createArrow(bucket));
                lastArrowBucket = bucket;
            }''',1)

          start=s.index('    public void showStoredTrack(List<GeoPoint> points) {')
          end=s.index('    public void clearStoredTrack() {', start)
          s=s[:start]+'''    public void showStoredTrack(List<GeoPoint> points) {
        clearStoredTrack();
        if (points == null || points.isEmpty()) return;
        int step = Math.max(1, points.size() / 10_000);
        Polyline segment = null;
        for (int index = 0; index < points.size(); index++) {
            GeoPoint point = points.get(index);
            boolean keep = point.segmentStart || index == 0 || index == points.size() - 1 || index % step == 0;
            if (!keep) continue;
            if (segment == null || point.segmentStart) {
                segment = newTrackPolyline(230, 8, 62, 45, 8f);
                storedTrackSegments.add(segment);
                mapView.getLayerManager().getLayers().add(segment);
            }
            segment.addPoint(new LatLong(point.latitude, point.longitude));
        }
        GeoPoint last = points.get(points.size() - 1);
        centerOn(last.latitude, last.longitude);
        mapView.getLayerManager().redrawLayers();
    }

'''+s[end:]
          start=s.index('    public void clearStoredTrack() {')
          end=s.index('    public void beginTrack() {', start)
          s=s[:start]+'''    public void clearStoredTrack() {
        for (Polyline line : storedTrackSegments) mapView.getLayerManager().getLayers().remove(line);
        storedTrackSegments.clear();
        mapView.getLayerManager().redrawLayers();
    }

'''+s[end:]
          start=s.index('    public void beginTrack() {')
          end=s.index('    public void destroy() {', start)
          s=s[:start]+'''    public void beginTrack() {
        for (Polyline line : activeTrackSegments) mapView.getLayerManager().getLayers().remove(line);
        activeTrackSegments.clear();
        activeTrackPointCount = 0;
        startTrackSegment();
    }

    public void startTrackSegment() {
        activeTrack = newTrackPolyline(255, 236, 122, 37, 7f);
        activeTrackSegments.add(activeTrack);
        mapView.getLayerManager().getLayers().add(activeTrack);
    }

    public void addTrackPoint(double latitude, double longitude) {
        if (activeTrack == null) startTrackSegment();
        if (activeTrackPointCount >= MAX_ACTIVE_DRAW_POINTS) {
            // Keep the journal complete while bounding only the live visual representation.
            for (Polyline line : activeTrackSegments) mapView.getLayerManager().getLayers().remove(line);
            activeTrackSegments.clear();
            activeTrackPointCount = 0;
            startTrackSegment();
        }
        activeTrack.addPoint(new LatLong(latitude, longitude));
        activeTrackPointCount++;
        mapView.getLayerManager().redrawLayers();
    }

    public void resumeFollow() {
        followSuspended = false;
        if (lastLocation != null && MapUiPreferences.followVehicle(mapView.getContext())) {
            mapView.getModel().mapViewPosition.setCenter(lastLocation);
        }
    }

    private Polyline newTrackPolyline(int alpha, int red, int green, int blue, float width) {
        org.mapsforge.core.graphics.Paint paint = AndroidGraphicFactory.INSTANCE.createPaint();
        paint.setColor(AndroidGraphicFactory.INSTANCE.createColor(alpha, red, green, blue));
        paint.setStrokeWidth(width);
        paint.setStyle(Style.STROKE);
        return new Polyline(paint, AndroidGraphicFactory.INSTANCE);
    }

'''+s[end:]
          p.write_text(s)

          bridge=Path('app/src/main/java/com/abosultan/darbakmaps/MapRuntimeBridge.java')
          b=bridge.read_text()
          b=b.replace('''    public static synchronized void resumeFollow() {\n        if (activeController == null) return;\n        MapUiPreferences.setFollowVehicle(activeController.view().getContext(), true);\n    }''',
'''    public static synchronized void resumeFollow() {
        if (activeController == null) return;
        activeController.resumeFollow();
    }''')
          bridge.write_text(b)

          main=Path('app/src/main/java/com/abosultan/darbakmaps/MainActivity.java')
          m=main.read_text()
          m=m.replace('''            TrackSessionState.updateActionLabel(actionRecord, this);\n            toast(paused ? "تم إيقاف تسجيل المسار مؤقتًا" : "تمت متابعة تسجيل المسار");''',
'''            TrackSessionState.updateActionLabel(actionRecord, this);
            if (!paused && mapController != null) mapController.startTrackSegment();
            toast(paused ? "تم إيقاف تسجيل المسار مؤقتًا" : "تمت متابعة تسجيل المسار");''')
          main.write_text(m)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: ./gradlew --no-daemon testDebugUnitTest :app:compileDebugJavaWithJavac
      - name: Commit remediation
        run: |
          git config user.name 'Darbak Review CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/abosultan/darbakmaps/map/OfflineMapController.java app/src/main/java/com/abosultan/darbakmaps/MapRuntimeBridge.java app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: bound track rendering, split segments, suspend follow on pan'
          git push origin HEAD:darbakmaps-final-0.8.0
