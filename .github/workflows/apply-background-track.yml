name: Darbak Maps Background Track Upgrade

on:
  push:
    paths:
      - 'tools/apply_background_track.py'
      - '.github/workflows/apply-background-track.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply background track upgrade
        run: python3 tools/apply_background_track.py

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Commit upgraded app
        run: |
          git config user.name "Darbak Build Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/abosultan/darbakmaps/BackgroundTrackService.java \
                  app/src/main/java/com/abosultan/darbakmaps/BootReceiver.java \
                  app/src/main/java/com/abosultan/darbakmaps/DarbakPanels.java \
                  app/src/main/java/com/abosultan/darbakmaps/MainActivity.java \
                  app/src/main/java/com/abosultan/darbakmaps/MapUiPreferences.java \
                  app/src/main/java/com/abosultan/darbakmaps/data/BackgroundTrackStore.java \
                  app/src/main/AndroidManifest.xml \
                  app/build.gradle
          git diff --cached --quiet || git commit -m "feat: persistent background track recording 0.6.1"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.6.1-background-track-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
