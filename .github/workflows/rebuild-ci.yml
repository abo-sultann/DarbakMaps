name: Darbak Maps Rebuild CI

on:
  push:
    branches: [ "darbakmaps-rebuild-1.0" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify clean rebuild
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug candidate for emulator only
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-rebuild-emulator-only
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
