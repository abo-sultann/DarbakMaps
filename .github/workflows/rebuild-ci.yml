name: Darbak Maps Rebuild CI

on:
  push:
    branches: [ "darbakmaps-rebuild-1.0" ]
  pull_request:
    branches: [ "darbakmaps-rebuild-1.0" ]
  workflow_dispatch:

concurrency:
  group: darbakmaps-rebuild-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify clean rebuild
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug candidate for emulator only
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-rebuild-emulator-only
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
      - name: Upload unsigned release handoff
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-1.0.0-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error
