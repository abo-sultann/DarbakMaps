name: Darbak Map Source Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Download private Mishari source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/diag/source build/diag/extracted
          gh release download darbak-map-source --pattern 'almishar-source.zip' --dir build/diag/source
          unzip -q build/diag/source/almishar-source.zip -d build/diag/extracted
          find build/diag/extracted -type f -printf '%s\t%p\n' | sort -nr | head -20
      - name: Inspect Garmin map structure
        run: |
          git clone --depth 1 https://github.com/vasilevzhivko/garmin_img.git build/diag/garmin_img
          IMG=$(find build/diag/extracted -type f -iname '*.img' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          cat > build/diag/garmin_img/example/darbak_diag.dart <<'DART'
          import 'dart:io';
          import 'package:garmin_img/garmin_img.dart';
          Future<void> main(List<String> args) async {
            final img = await GarminImg.open(args.first);
            print('submaps=${img.maps.length}');
            for (var i = 0; i < img.maps.length; i++) {
              final m = img.maps[i];
              print('map[$i] bounds=${m.bounds} levels=${m.levels.length} subdivisions=${m.subdivisions.length}');
              for (final level in m.levels) {
                print('map[$i] level=$level');
              }
            }
            print('polygonTypes=${img.polygonNames}');
            img.close();
          }
          DART
          cd build/diag/garmin_img
          dart pub get
          dart run example/darbak_diag.dart "$GITHUB_WORKSPACE/$IMG" | tee "$GITHUB_WORKSPACE/build/diag/source-diagnostic.txt"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-source-diagnostic
          path: build/diag/source-diagnostic.txt
          retention-days: 1
