name: Darbak Private Map Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/map/**'
      - '.github/workflows/map-build.yml'

permissions:
  contents: read

concurrency:
  group: darbak-private-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install map tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full osmium-tool python3-pip
          python3 -m pip install --break-system-packages requests beautifulsoup4

      - name: Build private Saudi map
        run: bash tools/map/build_darbak_map.sh

      - name: Upload Darbak map
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-private-map
          path: |
            build/map-output/darbak-saudi.map
            build/map-output/darbak-saudi.map.sha256
            build/map-output/darbak-map-manifest.json
            build/map-output/mishari-report.json
            build/map-output/mishari-img.txt
            build/map-output/mishari-files.txt
            build/map-output/mishari-osmium-info.txt
            build/map-output/merged-osmium-info.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
