name: Darbak Maps App + Offline Map Bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Package the verified release without rebuilding or changing its signature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir delivery
          gh release download darbakmaps-test --pattern DarbakMaps-debug.apk --dir delivery
          gh release download darbak-saudi-map-v1 --pattern darbak-saudi.map --dir delivery
          echo '409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c  delivery/darbak-saudi.map' | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-car-screen-test-bundle
          path: delivery/
          retention-days: 1
          compression-level: 0
