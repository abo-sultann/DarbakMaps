name: Apply 0.9.1 saved-place fixes

on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - 'tools/apply_review_091_saved_places.py'
      - '.github/workflows/apply-review-091-saved-places.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_review_091_saved_places.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Behavioral unit tests and compile
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugJavaWithJavac
      - name: Commit generated fixes
        run: |
          git config user.name 'Darbak Review CI'
          git config user.email 'actions@github.com'
          git add app/src/main app/src/test
          if ! git diff --cached --quiet; then
            git commit -m 'fix: make saved places spatial and interaction-safe'
            git push
          fi
