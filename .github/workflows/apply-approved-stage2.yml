name: Apply approved automatic tracking UI migration
on:
  push:
    branches: [darbakmaps-final-0.8.0]
    paths:
      - 'tools/apply_approved_execution_stage2.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-final-0.8.0
          fetch-depth: 0
      - run: python3 tools/apply_approved_execution_stage2.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugJavaWithJavac
      - run: |
          git config user.name 'Darbak Approved Execution CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: make rolling track automatic with pause and snapshot'
          git fetch origin darbakmaps-final-0.8.0
          git rebase origin/darbakmaps-final-0.8.0
          git push origin HEAD:darbakmaps-final-0.8.0
