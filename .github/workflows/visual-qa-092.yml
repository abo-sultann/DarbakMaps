name: Darbak Maps Visual QA

on:
  workflow_dispatch:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - 'app/src/main/java/com/abosultan/darbakmaps/**'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - '.github/workflows/visual-qa-092.yml'
      - '.github/scripts/visual_qa_092.sh'

permissions:
  contents: read

concurrency:
  group: darbak-maps-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Render real UI on Android 7.1 at 1024x600
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/visual_qa_092.sh

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.9.2-visual-qa-1024x600
          path: visual-qa/
          retention-days: 1
          if-no-files-found: warn
