name: Android Build - Self Hosted

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses | Out-Null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "app\build\outputs\apk\debug\app-debug.apk"
          if (!(Test-Path $apk)) { throw "APK was not produced" }
          Get-Item $apk | Format-List FullName,Length,LastWriteTime

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.4.0-debug-selfhosted
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
