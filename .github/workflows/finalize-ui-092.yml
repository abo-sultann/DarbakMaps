name: Finalize Darbak 0.9.2 UI
on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - '.github/workflows/finalize-ui-092.yml'
      - '.github/scripts/finalize_ui_092.py'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-review-0.9.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply final UI refinements
        run: python3 .github/scripts/finalize_ui_092.py
      - name: Audit UI leftovers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo '=== legacy rgb blue ==='
            grep -R -n "57, 169, 255" app/src/main/java app/src/main/res || true
            echo '=== legacy hex blue ==='
            grep -R -n "#39A9FF" app/src/main/java app/src/main/res || true
            echo '=== ProgressDialog ==='
            grep -R -n "new ProgressDialog" app/src/main/java/com/abosultan/darbakmaps || true
            echo '=== stock Spinner in point editor ==='
            grep -n "new Spinner" app/src/main/java/com/abosultan/darbakmaps/PointEditor.java || true
            echo '=== duplicate side panel ==='
            grep -n "LinearLayout sidePanel" app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java || true
            echo '=== stock AlertDialog builders ==='
            grep -R -n "new AlertDialog.Builder" app/src/main/java/com/abosultan/darbakmaps || true
          } | tee dist/ui-audit.txt
          if grep -R -q "57, 169, 255" app/src/main/java app/src/main/res; then exit 1; fi
          if grep -R -q "#39A9FF" app/src/main/java app/src/main/res; then exit 1; fi
          if grep -R -q "new ProgressDialog" app/src/main/java/com/abosultan/darbakmaps; then exit 1; fi
          if grep -q "new Spinner" app/src/main/java/com/abosultan/darbakmaps/PointEditor.java; then exit 1; fi
          if grep -q "LinearLayout sidePanel" app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java; then exit 1; fi
          grep -q "DarbakProgressDialog" app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          grep -q "DarbakProgressDialog" app/src/main/java/com/abosultan/darbakmaps/DarbakPanels.java
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Compile UI
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-UI-Audit-0.9.2
          path: dist/ui-audit.txt
          retention-days: 1
      - name: Commit final UI
        run: |
          git config user.name 'Darbak CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java app/src/main/res
          git diff --cached --quiet && exit 0
          git commit -m 'ui: finish Darbak 0.9.2 car-screen experience'
          git push origin HEAD:darbakmaps-review-0.9.1
