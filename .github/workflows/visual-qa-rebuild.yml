name: Darbak Maps Rebuild Visual QA

on:
  push:
    branches: [ "darbakmaps-rebuild-1.0" ]
    paths:
      - 'app/**'
      - '.github/workflows/visual-qa-rebuild.yml'
      - '.github/scripts/visual_qa_rebuild.sh'
      - '.github/scripts/background_track_qa.sh'
      - '.github/scripts/saved_places_qa.sh'
      - '.github/scripts/tracks_runtime_qa.sh'
  workflow_dispatch:

concurrency:
  group: darbakmaps-rebuild-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
      - name: Render + GPS + saved-place + track runtime QA on Android 7.1 / 1024x600 / 1GB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: darbak_qa
          ram-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            test -f "$ANDROID_AVD_HOME/darbak_qa.avd/config.ini"
            sed -i '/^hw\.lcd\.width=/d;/^hw\.lcd\.height=/d;/^hw\.lcd\.density=/d;/^hw\.initialOrientation=/d;/^skin\.name=/d;/^skin\.path=/d;/^skin\.path\.backup=/d;/^skin\.dynamic=/d;/^showDeviceFrame=/d' "$ANDROID_AVD_HOME/darbak_qa.avd/config.ini"
            printf '%s\n' 'hw.lcd.width=1024' 'hw.lcd.height=600' 'hw.lcd.density=160' 'hw.initialOrientation=Landscape' 'skin.dynamic=yes' 'skin.name=1024x600' 'skin.path=_no_skin' 'skin.path.backup=_no_skin' 'showDeviceFrame=no' >> "$ANDROID_AVD_HOME/darbak_qa.avd/config.ini"
            grep -E '^(hw\.lcd\.(width|height|density)|hw\.initialOrientation|skin\.(name|path|dynamic)|showDeviceFrame)=' "$ANDROID_AVD_HOME/darbak_qa.avd/config.ini"
          script: bash .github/scripts/visual_qa_rebuild.sh && bash .github/scripts/background_track_qa.sh && (bash .github/scripts/saved_places_qa.sh || (echo 'Saved-place QA transient failure; reset app state and retry once' && adb shell pm clear com.abosultan.darbakmaps.debug >/dev/null && adb shell pm grant com.abosultan.darbakmaps.debug android.permission.ACCESS_FINE_LOCATION && bash .github/scripts/saved_places_qa.sh)) && bash .github/scripts/tracks_runtime_qa.sh
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-rebuild-visual-1024x600
          path: visual-qa/**
          retention-days: 1
