name: Darbak Maps UX Upgrade

on:
  push:
    paths:
      - 'tools/apply_darbak_map_ux.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply upgrade
        run: python3 tools/apply_darbak_map_ux.py

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Commit upgraded app
        run: |
          git config user.name "Darbak Build Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/abosultan/darbakmaps/MainActivity.java app/src/main/java/com/abosultan/darbakmaps/DarbakPanels.java app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java app/src/main/java/com/abosultan/darbakmaps/map/OfflineMapSearchEngine.java app/build.gradle
          git diff --cached --quiet || git commit -m "feat: Darbak Maps 0.6.0 UX upgrade"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.6.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
