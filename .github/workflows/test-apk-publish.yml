name: Darbak Test APK Publish

on:
  workflow_run:
    workflows: [Android Build]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: darbakmaps-test-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download APK artifact from exact run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: DarbakMaps-debug
          path: release-apk

      - name: Read identity from APK itself
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK=release-apk/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" | head -1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" | head -1)"
          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE_NAME" = "com.abosultan.darbakmaps.debug"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$MIN_SDK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          cp "$APK" "release-apk/DarbakMaps-${VERSION_NAME}-${SHORT_SHA}.apk"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "min_sdk=$MIN_SDK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "asset_name=DarbakMaps-${VERSION_NAME}-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish immutable test asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail
          TAG="darbakmaps-test-v${VERSION_CODE}-${SHORT_SHA}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Darbak Maps test ${VERSION_NAME} (${SHORT_SHA})" \
              --notes "Immutable test APK from workflow run ${{ github.event.workflow_run.id }}."
          fi
          gh release upload "$TAG" "release-apk/${ASSET_NAME}" --clobber
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Update test manifest only from same APK
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          MIN_SDK: ${{ steps.meta.outputs.min_sdk }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-main origin/main
          CURRENT_CODE=0
          if [ -f update-manifest-debug.json ]; then
            CURRENT_CODE="$(python3 - <<'PY'
          import json
          try:
              print(int(json.load(open('update-manifest-debug.json')).get('versionCode', 0)))
          except Exception:
              print(0)
          PY
            )"
          fi
          if [ "$VERSION_CODE" -lt "$CURRENT_CODE" ]; then
            echo "Refusing to move test channel backwards: ${VERSION_CODE} < ${CURRENT_CODE}"
            exit 0
          fi
          cat > update-manifest-debug.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "packageName": "${PACKAGE_NAME}",
            "minSdk": ${MIN_SDK},
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}",
            "sha256": "${SHA256}",
            "buildCommit": "${{ github.event.workflow_run.head_sha }}",
            "buildRunId": "${{ github.event.workflow_run.id }}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest-debug.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: publish test manifest from exact APK ${VERSION_NAME}"
          git push origin HEAD:main
