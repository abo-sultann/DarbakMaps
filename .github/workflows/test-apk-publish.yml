name: Darbak Test APK Publish
on:
  workflow_run:
    workflows: [Android Build]
    types: [completed]
permissions:
  actions: read
  contents: write
concurrency:
  group: darbakmaps-test-publish
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: DarbakMaps-debug
          path: release-apk
      - name: Validate built metadata and reject a superseded build
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BUILT_SHA"
          APK=$(find release-apk -name app-debug.apk -print -quit)
          META=$(find release-apk -name release-metadata.json -print -quit)
          cp "$APK" DarbakMaps-debug.apk
          cp "$META" release-metadata.json
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          m=json.loads(Path('release-metadata.json').read_text())
          assert m['sourceCommit']==os.environ['BUILT_SHA']
          assert hashlib.sha256(Path('DarbakMaps-debug.apk').read_bytes()).hexdigest()==m['sha256']
          assert m['packageName']=='com.abosultan.darbakmaps.debug' and m['minSdk']<=25
          m['apkUrl']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v'+m['versionName']+'/DarbakMaps-debug.apk'
          Path('update-manifest-debug.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Preserve official Saudi map as a durable verified data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view darbak-saudi-map-v1 >/dev/null 2>&1; then
            gh run download 34758044067 --name DarbakMaps-offline-map-final --dir official-map
            echo '409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c  official-map/darbak-saudi.map' | sha256sum -c
            gh release create darbak-saudi-map-v1 official-map/darbak-saudi.map --target "$GITHUB_SHA" --title 'Darbak Saudi — verified offline map' --notes 'Existing approved map, unchanged. SHA-256: 409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c' --latest=false
          fi
      - name: Publish versioned APK and stable alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('release-metadata.json'))['versionName'])")
          gh release create "v$VERSION" DarbakMaps-debug.apk release-metadata.json --target "$GITHUB_SHA" --title "Darbak Maps $VERSION" --notes-file docs/RELEASE-0.7.2.md
          gh release upload darbakmaps-test DarbakMaps-debug.apk --clobber
      - name: Publish manifest only after verified APK upload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest-debug.json
          git commit -m 'release: publish verified update manifest [skip ci]'
          git push origin HEAD:main
