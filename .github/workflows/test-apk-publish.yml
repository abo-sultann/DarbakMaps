name: Darbak Test APK Publish

on:
  workflow_run:
    workflows: [Android Build]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: darbakmaps-test-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: DarbakMaps-debug
          path: release-apk

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK=release-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" release-apk/DarbakMaps-debug.apk
          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          SHA256=$(sha256sum release-apk/DarbakMaps-debug.apk | awk '{print $1}')
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish stable test asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view darbakmaps-test >/dev/null 2>&1; then
            gh release create darbakmaps-test \
              --title 'Darbak Maps — latest test build' \
              --notes 'Stable test channel for the car screen. Install the current baseline once; later test updates can be installed from inside the app.'
          fi
          gh release upload darbakmaps-test release-apk/DarbakMaps-debug.apk --clobber

      - name: Update test manifest
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          cat > update-manifest-debug.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "packageName": "com.abosultan.darbakmaps.debug",
            "minSdk": 24,
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/darbakmaps-test/DarbakMaps-debug.apk",
            "sha256": "${SHA256}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest-debug.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: refresh Darbak Maps test update manifest"
          git push origin HEAD:main
