name: Saudi map search acceptance

on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - 'app/src/main/java/com/abosultan/darbakmaps/map/OfflineMapSearchEngine.java'
      - 'app/src/test/java/com/abosultan/darbakmaps/map/SaudiMapSearchIntegrationTest.java'
      - '.github/workflows/saudi-map-search-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download approved Saudi Mapsforge file
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o darbak-saudi.map \
            'https://github.com/abo-sultann/DarbakMaps/releases/download/darbak-saudi-map-v1/darbak-saudi.map'
          echo '409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c  darbak-saudi.map' | sha256sum -c -
          test "$(stat -c%s darbak-saudi.map)" -eq 189923374
      - name: Run real-map search acceptance
        run: |
          export JAVA_TOOL_OPTIONS="-Ddarbak.map.path=$PWD/darbak-saudi.map -Ddarbak.search.report=$PWD/saudi-search-report.txt"
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.abosultan.darbakmaps.map.SaudiMapSearchIntegrationTest'
          cat saudi-search-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DarbakMaps-0.9.1-saudi-search-evidence
          path: |
            saudi-search-report.txt
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
