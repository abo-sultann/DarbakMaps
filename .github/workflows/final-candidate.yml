name: Darbak Maps Final Candidate

on:
  push:
    branches: [darbakmaps-final-0.8.0]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/final-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darbak-maps-final-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Release lint
        run: ./gradlew --no-daemon :app:lintRelease
      - name: Build unsigned release
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify candidate exists
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          sha256sum "$APK" > candidate-sha256.txt
          ls -lh "$APK"
          cat candidate-sha256.txt
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.8.0-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            candidate-sha256.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/
          retention-days: 1
          if-no-files-found: error
