name: Android Build

on:
  push:
    branches: [main, darbak-platform-v1, production-hardening-v1, darbakmaps-0.2.4-ui, darbakmaps-0.2.5-owner-fix, darbakmaps-0.3.0]
    paths-ignore:
      - 'tools/map/**'
      - '.github/workflows/map-build.yml'
      - '.github/workflows/map-build-fast.yml'
      - '.github/workflows/map-source-diagnostic.yml'
      - '.github/workflows/map-publish.yml'
      - '.github/workflows/test-apk-publish.yml'
      - 'update-manifest-debug.json'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darbak-maps-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore protected signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DARBAK_MAPS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DARBAK_MAPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARBAK_MAPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DARBAK_MAPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo '::error::Darbak Maps signing secrets are not configured. Refusing to build with an unstable key.'
            exit 1
          fi
          KEY="$RUNNER_TEMP/darbak-maps-stable.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEY"
          test -s "$KEY"
          keytool -list -keystore "$KEY" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT="$RUNNER_TEMP/darbak-maps-signing.der"
          keytool -exportcert -keystore "$KEY" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -file "$CERT" >/dev/null
          ACTUAL_CERT_SHA256="$(sha256sum "$CERT" | cut -d ' ' -f 1)"
          if [ "$ACTUAL_CERT_SHA256" != "cebaccb7712e30ec2053d5e8932b921c93e51ef9dedad2c7d111709f28e14eb7" ]; then
            echo '::error::Signing certificate does not match the verified 0.7.1 baseline. Refusing an incompatible update.'
            exit 1
          fi
          echo "DARBAK_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "DARBAK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DARBAK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DARBAK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee DarbakMaps-0.8.0-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.8.0-production
          path: |
            app/build/outputs/apk/release/app-release.apk
            DarbakMaps-0.8.0-sha256.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/
          retention-days: 1
          if-no-files-found: error
