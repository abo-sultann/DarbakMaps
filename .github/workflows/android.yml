name: Android Build

on:
  push:
    branches: [main, darbak-platform-v1, production-hardening-v1, darbakmaps-0.2.4-ui, darbakmaps-0.2.5-owner-fix, darbakmaps-0.3.0, production-0.3.0-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darbak-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and unit tests
        run: ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.3.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
