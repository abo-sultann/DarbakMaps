name: Android Build

on:
  push:
    branches: [main, maintenance-0.7.2, darbak-platform-v1, production-hardening-v1, darbakmaps-0.2.4-ui, darbakmaps-0.2.5-owner-fix, darbakmaps-0.3.0]
    paths-ignore:
      - 'tools/map/**'
      - '.github/workflows/map-build.yml'
      - '.github/workflows/map-build-fast.yml'
      - '.github/workflows/map-source-diagnostic.yml'
      - '.github/workflows/map-publish.yml'
      - '.github/workflows/test-apk-publish.yml'
      - 'update-manifest-debug.json'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darbak-maps-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: darbakmaps-debug-signing-v1

      - name: Verify stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s ~/.android/debug.keystore || {
            echo "::error::Stable debug signing key missing; refusing incompatible update build."
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
