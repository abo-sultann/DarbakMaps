name: Darbak Offline Map Recovery Build

on:
  push:
    paths:
      - '.github/workflows/map-build-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darbak-map-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAVACMD_OPTIONS: -Xmx5g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install map tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip 7zip osmium-tool python3-pip
          python3 -m pip install --user gdown

      - name: Restore verified Drive-based Mishari builder
        run: |
          git show f175e22e0611e1adbfe84f94726e91b4206f0cd0:tools/map/build_darbak_map.sh > tools/map/build_darbak_map.recovery.sh
          chmod +x tools/map/build_darbak_map.recovery.sh
          sed -i 's/python3 -m gdown --id "$MISHARI_DRIVE_ID" --output "$ARCHIVE"/python3 -m gdown "$MISHARI_DRIVE_ID" --output "$ARCHIVE"/' tools/map/build_darbak_map.recovery.sh
          sed -i 's/^7z x /7zz x /' tools/map/build_darbak_map.recovery.sh
          sed -i 's/type=hd/type=ram/' tools/map/build_darbak_map.recovery.sh
          sed -i 's/threads=2/threads=4/' tools/map/build_darbak_map.recovery.sh

      - name: Build final Saudi offline map
        run: bash tools/map/build_darbak_map.recovery.sh

      - name: Verify output
        run: |
          test -s build/map-output/darbak-saudi.map
          test -s build/map-output/darbak-saudi.map.sha256
          test -s build/map-output/darbak-map-manifest.json
          cat build/map-output/darbak-saudi.map.sha256
          ls -lh build/map-output/darbak-saudi.map

      - name: Upload final offline map
        uses: actions/upload-artifact@v4
        with:
          name: DarbakMaps-offline-map-final
          path: |
            build/map-output/darbak-saudi.map
            build/map-output/darbak-saudi.map.sha256
            build/map-output/darbak-map-manifest.json
            build/map-output/mishari-report.json
            build/map-output/mishari-img.txt
            build/map-output/mishari-files.txt
            build/map-output/mishari-osmium-info.txt
            build/map-output/merged-osmium-info.txt
            build/map-output/osm-fileinfo.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
