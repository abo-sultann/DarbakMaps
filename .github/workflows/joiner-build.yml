name: Darbak Joiner APK

on:
  push:
    branches: [ main ]
    paths:
      - 'joiner/**'
      - 'settings.gradle'
      - '.github/workflows/joiner-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle
        run: chmod +x ./gradlew
      - name: Build Joiner APK
        run: ./gradlew --no-daemon :joiner:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p build/joiner-release
          cp joiner/build/outputs/apk/debug/joiner-debug.apk build/joiner-release/DarbakJoiner.apk
      - name: Upload Joiner APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakJoiner
          path: build/joiner-release/DarbakJoiner.apk
          retention-days: 7
          if-no-files-found: error
