name: Darbak Map Publish

on:
  workflow_run:
    workflows:
      - Darbak Private Map Build
      - Darbak Private Map Fast Build
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: darbak-map-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.repository.private && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download successful map artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: DarbakMaps-private-map*
          merge-multiple: true
          path: release-map

      - name: Verify package
        run: |
          set -euo pipefail
          test -s release-map/darbak-saudi.map
          test -s release-map/darbak-saudi.map.sha256
          (cd release-map && sha256sum -c darbak-saudi.map.sha256)

      - name: Publish private latest map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view darbak-map-latest >/dev/null 2>&1; then
            gh release create darbak-map-latest --title 'Darbak Saudi Map — latest private build' --notes 'Private Darbak Maps vector package.'
          fi
          gh release upload darbak-map-latest \
            release-map/darbak-saudi.map \
            release-map/darbak-saudi.map.sha256 \
            release-map/darbak-map-manifest.json \
            release-map/mishari-report.json \
            release-map/mishari-osmium-info.txt \
            release-map/merged-osmium-info.txt \
            --clobber
