name: Apply 0.9.1 offline search fixes

on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - 'tools/apply_review_091_search.py'
      - '.github/workflows/apply-review-091-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply search patch
        run: |
          mkdir -p app/src/test/java/com/abosultan/darbakmaps/map
          python3 tools/apply_review_091_search.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Search behavior tests and compile
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugJavaWithJavac
      - name: Commit generated fixes
        run: |
          git config user.name 'Darbak Review CI'
          git config user.email 'actions@github.com'
          git add app/src/main app/src/test
          if ! git diff --cached --quiet; then
            git commit -m 'fix: make offline search crash-safe and pageable'
            git push
          fi