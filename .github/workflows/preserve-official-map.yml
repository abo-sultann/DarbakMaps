name: Preserve Official Saudi Map
on:
  push:
    branches: [darbakmaps-data-integrity-stage1]
    paths: ['.github/workflows/preserve-official-map.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: preserve-official-saudi-map
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve verified original without rebuilding map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-map"
          cd "$RUNNER_TEMP/official-map"
          TAG=darbak-saudi-map-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern darbak-saudi.map
          else
            gh run download 34758044067 --name DarbakMaps-offline-map-final
          fi
          test "$(stat -c %s darbak-saudi.map)" = 189923374
          printf '%s  %s\n' '409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c' 'darbak-saudi.map' > darbak-saudi.map.sha256
          sha256sum -c darbak-saudi.map.sha256
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' 'Original DarbakMaps Saudi offline map, preserved byte-for-byte.' 'Size: 189923374 bytes.' 'SHA-256: 409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c' 'This release contains map data only, not a new application APK.' > release-notes.txt
            gh release create "$TAG" darbak-saudi.map darbak-saudi.map.sha256 --target 272d82d918097629e9581a58bf77d9fd8f0a1235 --title 'Darbak Saudi Map — original v1' --notes-file release-notes.txt --latest=false
          fi
          mkdir verify
          gh release download "$TAG" --pattern darbak-saudi.map --dir verify
          cd verify
          test "$(stat -c %s darbak-saudi.map)" = 189923374
          printf '%s  %s\n' '409d7ecaf2d6c610921cfadd42855fbdd3ce63ae08a00ff94965b18bb25fdd1c' 'darbak-saudi.map' | sha256sum -c -
