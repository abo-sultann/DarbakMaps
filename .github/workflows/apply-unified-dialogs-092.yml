name: Apply unified Darbak interaction panels
on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - '.github/workflows/apply-unified-dialogs-092.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-review-0.9.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply unified car-screen panels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('app/src/main/java/com/abosultan/darbakmaps')

          # Remove all surviving old navy backgrounds from programmatic UI while keeping alpha values.
          patterns = [
              (r'Color\.argb\((\d+),\s*7,\s*17,\s*29\)', r'Color.argb(\1, 8, 39, 31)'),
              (r'Color\.argb\((\d+),\s*17,\s*29,\s*43\)', r'Color.argb(\1, 16, 52, 42)'),
              (r'Color\.argb\((\d+),\s*16,\s*30,\s*44\)', r'Color.argb(\1, 25, 72, 58)'),
              (r'Color\.argb\((\d+),\s*215,\s*173,\s*85\)', r'Color.argb(\1, 216, 180, 91)'),
          ]
          for p in ROOT.rglob('*.java'):
              s = p.read_text()
              old = s
              for pattern, replacement in patterns:
                  s = re.sub(pattern, replacement, s)
              if s != old:
                  p.write_text(s)

          def replace_method(src, start_marker, end_marker, replacement, label):
              start = src.find(start_marker)
              if start < 0:
                  raise SystemExit('missing method start: ' + label)
              end = src.find(end_marker, start)
              if end < 0:
                  raise SystemExit('missing method end: ' + label)
              return src[:start] + replacement + '\n\n' + src[end:]

          # MainActivity: replace stock item choosers with the unified Darbak panel.
          p = ROOT / 'MainActivity.java'
          s = p.read_text()

          s = replace_method(s,
              '    private void showSearchResults(OfflineMapSearchEngine.SearchRequest request,',
              '    private void showSearchResultActions(OfflineMapSearchEngine.Result result) {',
'''    private void showSearchResults(OfflineMapSearchEngine.SearchRequest request,
                                   List<OfflineMapSearchEngine.Result> results,
                                   boolean complete, boolean failed, boolean queryMore) {
        if (mapController != null) mapController.showSearchResults(results);
        if (results.isEmpty()) {
            if (!complete) toast("لا توجد نتائج في الجزء المفهرس حتى الآن؛ الفهرسة ما زالت جارية");
            else if (failed) toast("اكتمل الفهرس مع تعذر قراءة بعض أجزاء الخريطة");
            else toast(MapStorage.activeMap(this).isFile() ? "لا توجد نتائج مطابقة" : "أضف خريطة دربك للبحث في المعالم");
            return;
        }
        int extra = queryMore ? 1 : 0;
        String[] labels = new String[results.size() + extra];
        for (int i = 0; i < results.size(); i++) {
            OfflineMapSearchEngine.Result result = results.get(i);
            String distance = formatDistance(result.distanceMeters);
            labels[i] = result.name + "   •   " + result.source + (distance.isEmpty() ? "" : "   •   " + distance);
        }
        if (queryMore) labels[labels.length - 1] = "عرض المزيد من النتائج";
        String state = complete ? "نتائج البحث" : "نتائج الجزء المفهرس";
        if (failed) state += " • يوجد جزء تعذر قراءته";
        int page = request.offset > 0 ? request.offset / Math.max(1, request.limit) + 1 : 1;
        DarbakChoiceDialog.show(this, state,
                "صفحة " + page + " • اختر نتيجة لعرض الخيارات",
                labels, index -> {
                    if (index < results.size()) {
                        showSearchResultActions(results.get(index));
                    } else {
                        OfflineMapSearchEngine.SearchRequest next = searchEngine.nextPageRequest(request);
                        if (next != null && next != request) executeSearch(next, "بحث");
                    }
                }, queryMore ? labels.length - 1 : -1);
    }''', 'search results')

          s = replace_method(s,
              '    private void showSearchResultActions(OfflineMapSearchEngine.Result result) {',
              '    void showNearbySearchFromCurrentLocation() {',
'''    private void showSearchResultActions(OfflineMapSearchEngine.Result result) {
        String distance = formatDistance(result.distanceMeters);
        String[] actions = {"عرض على الخريطة", "حفظ الموقع", "توجيه مباشر", "البحث حول هذا المعلم"};
        String detail = result.source + (distance.isEmpty() ? "" : " • " + distance)
                + " • " + coordinates(result.latitude, result.longitude);
        DarbakChoiceDialog.show(this, result.name, detail, actions, which -> {
            if (which == 0) {
                if (mapController != null) mapController.showPoint(result.latitude, result.longitude);
            } else if (which == 1) {
                PointEditor.show(this, result.latitude, result.longitude, null);
            } else if (which == 2) {
                startDirectNavigation(result.name, result.latitude, result.longitude);
            } else {
                showNearbySearchOptions(result.latitude, result.longitude, result.name);
            }
        });
    }''', 'search result actions')

          s = replace_method(s,
              '    private void showNearbySearchOptions(double latitude, double longitude, String centerLabel) {',
              '    private void showNearbyRadiusPicker(double latitude, double longitude, String centerLabel, String category) {',
'''    private void showNearbySearchOptions(double latitude, double longitude, String centerLabel) {
        String[] categories = { OfflineMapSearchEngine.CATEGORY_ALL, OfflineMapSearchEngine.CATEGORY_WADIS,
                OfflineMapSearchEngine.CATEGORY_MOUNTAINS, OfflineMapSearchEngine.CATEGORY_LANDMARKS,
                OfflineMapSearchEngine.CATEGORY_VILLAGES, OfflineMapSearchEngine.CATEGORY_WATER,
                OfflineMapSearchEngine.CATEGORY_SERVICES };
        DarbakChoiceDialog.show(this, "بحث حول " + centerLabel,
                "اختر نوع المعالم", categories,
                categoryIndex -> showNearbyRadiusPicker(latitude, longitude, centerLabel, categories[categoryIndex]));
    }''', 'nearby categories')

          s = replace_method(s,
              '    private void showNearbyRadiusPicker(double latitude, double longitude, String centerLabel, String category) {',
              '    private void runNearbySearch(double latitude, double longitude, String centerLabel, String category, int radiusKm) {',
'''    private void showNearbyRadiusPicker(double latitude, double longitude, String centerLabel, String category) {
        int[] radii = {5, 10, 25, 50, 100};
        String[] labels = {"5 كم", "10 كم", "25 كم", "50 كم", "100 كم"};
        DarbakChoiceDialog.show(this, category,
                "نطاق البحث حول " + centerLabel, labels,
                which -> runNearbySearch(latitude, longitude, centerLabel, category, radii[which]));
    }''', 'nearby radius')

          s = replace_method(s,
              '    private void showSavedPlaceCluster(List<PlaceRepository.Place> places) {',
              '    private void startDirectNavigation(String name, double latitude, double longitude) {',
'''    private void showSavedPlaceCluster(List<PlaceRepository.Place> places) {
        if (places == null || places.isEmpty()) return;
        String[] labels = new String[places.size()];
        for (int i = 0; i < places.size(); i++) labels[i] = places.get(i).name;
        DarbakChoiceDialog.show(this, "مواقع متقاربة",
                "اختر الموقع المطلوب بدقة", labels, which -> {
                    PlaceRepository.Place selected = places.get(which);
                    startDirectNavigation(selected.name, selected.latitude, selected.longitude);
                });
    }''', 'saved cluster')

          s = replace_method(s,
              '    private void showSavedHub() {',
              '    private void showPlaces(List<PlaceRepository.Place> places, String title) {',
'''    private void showSavedHub() {
        String[] items = { "المواقع المحفوظة (" + placeRepository.all().size() + ")", "الأقرب إلى موقعي",
                "حفظ نسخة من آخر 1000 كم", "المسارات السابقة (" + TrackStorage.list(this).length + ")" };
        DarbakChoiceDialog.show(this, "المحفوظات والمسارات",
                "مواقعك ومساراتك محفوظة محليًا", items, which -> {
                    if (which == 0) showPlaces(placeRepository.all(), "المواقع المحفوظة");
                    else if (which == 1) showNearbyPlaces();
                    else if (which == 2) saveAutomaticTrackSnapshot();
                    else showTracks();
                });
    }''', 'saved hub')

          s = replace_method(s,
              '    private void showPlaces(List<PlaceRepository.Place> places, String title) {',
              '    private void showNearbyPlaces() {',
'''    private void showPlaces(List<PlaceRepository.Place> places, String title) {
        if (places.isEmpty()) { toast("لا توجد مواقع محفوظة بعد"); return; }
        String[] labels = new String[places.size()];
        for (int i = 0; i < places.size(); i++) {
            PlaceRepository.Place place = places.get(i);
            labels[i] = place.name + "   •   " + coordinates(place.latitude, place.longitude);
        }
        DarbakChoiceDialog.show(this, title,
                "اختر موقعًا لبدء التوجيه المباشر", labels, which -> {
                    PlaceRepository.Place place = places.get(which);
                    startDirectNavigation(place.name, place.latitude, place.longitude);
                });
    }''', 'places list')

          s = replace_method(s,
              '    private void showTracks() {',
              '    private void openTrack(File file) {',
'''    private void showTracks() {
        File[] tracks = TrackStorage.list(this);
        if (tracks.length == 0) { toast("لا توجد مسارات محفوظة بعد"); return; }
        String[] names = new String[tracks.length];
        for (int i = 0; i < tracks.length; i++) names[i] = tracks[i].getName();
        DarbakChoiceDialog.show(this, "المسارات السابقة",
                "اختر مسارًا لعرضه على الخريطة", names, which -> openTrack(tracks[which]));
    }''', 'tracks')

          s = replace_method(s,
              '    private void promptBacktrack(File file) {',
              '    private void startBacktrack(File file) {',
'''    private void promptBacktrack(File file) {
        String[] actions = {"عرض المسار فقط", "ابدأ العودة على نفس الأثر"};
        DarbakChoiceDialog.show(this, "مسار محفوظ",
                "يمكن عرضه فقط أو اتباع نفس الأثر بالعكس دون حساب طريق جديد.",
                actions, which -> { if (which == 1) startBacktrack(file); }, 1);
    }''', 'backtrack prompt')
          p.write_text(s)

          # Long-press map point options also use Darbak panel.
          p = ROOT / 'DarbakMapContainer.java'
          s = p.read_text()
          old = '''        String[] actions = {"حفظ موقع هنا", "البحث حول هذه النقطة"};
        new AlertDialog.Builder(activity)
                .setTitle("النقطة المحددة")
                .setItems(actions, (dialog, which) -> {
                    if (which == 0) PointEditor.show(activity, point.latitude, point.longitude, null);
                    else if (activity instanceof MainActivity) {
                        ((MainActivity) activity).showNearbySearchAroundPoint(point.latitude, point.longitude);
                    }
                })
                .setNegativeButton("إلغاء", null)
                .show();'''
          new = '''        String[] actions = {"حفظ موقع هنا", "البحث حول هذه النقطة"};
        DarbakChoiceDialog.show(activity, "النقطة المحددة",
                String.format(java.util.Locale.US, "%.6f • %.6f", point.latitude, point.longitude),
                actions, which -> {
                    if (which == 0) PointEditor.show(activity, point.latitude, point.longitude, null);
                    else if (activity instanceof MainActivity) {
                        ((MainActivity) activity).showNearbySearchAroundPoint(point.latitude, point.longitude);
                    }
                });'''
          if old not in s:
              raise SystemExit('map point dialog anchor missing')
          s = s.replace(old, new)
          p.write_text(s)

          # Saved places become a fully custom Dialog (no white Android title frame), and edit/delete is branded.
          p = ROOT / 'SavedPlacesDialog.java'
          s = p.read_text()
          if 'import android.app.Dialog;' not in s:
              s = s.replace('import android.app.AlertDialog;\n', 'import android.app.AlertDialog;\nimport android.app.Dialog;\n')
          s = s.replace('        private AlertDialog dialog;', '        private Dialog dialog;')
          anchor = '''            TextView help = new TextView(activity);
            help.setText("اضغط للتوجيه • ضغط مطوّل للتعديل أو الحذف");'''
          title_block = '''            TextView heading = new TextView(activity);
            heading.setText("المواقع المحفوظة");
            heading.setTextSize(22f);
            heading.setTextColor(Color.rgb(247, 242, 231));
            heading.setGravity(Gravity.RIGHT | Gravity.CENTER_VERTICAL);
            root.addView(heading, new LinearLayout.LayoutParams(-1, dp(38)));

            TextView help = new TextView(activity);
            help.setText("اضغط للتوجيه • ضغط مطوّل للتعديل أو الحذف");'''
          if anchor not in s:
              raise SystemExit('saved heading anchor missing')
          s = s.replace(anchor, title_block)
          old_dialog = '''            dialog = new AlertDialog.Builder(activity)
                    .setTitle("المواقع المحفوظة")
                    .setView(root)
                    .setNegativeButton("إغلاق", null)
                    .create();
            dialog.setOnDismissListener(d -> {
                Panel current = active.get();
                if (current == this) active.clear();
            });
            dialog.show();
            rebuild(true);'''
          new_dialog = '''            TextView close = new TextView(activity);
            close.setText("إغلاق");
            close.setTextSize(14f);
            close.setTextColor(Color.rgb(185, 179, 165));
            close.setGravity(Gravity.CENTER);
            close.setBackground(round(Color.rgb(16, 52, 42), dp(14), Color.argb(50, 216, 180, 91)));
            close.setOnClickListener(v -> { if (dialog != null) dialog.dismiss(); });
            LinearLayout.LayoutParams closeParams = new LinearLayout.LayoutParams(dp(150), dp(42));
            closeParams.gravity = Gravity.CENTER;
            closeParams.topMargin = dp(8);
            root.addView(close, closeParams);

            dialog = new Dialog(activity);
            dialog.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE);
            dialog.setContentView(root);
            dialog.setOnDismissListener(d -> {
                Panel current = active.get();
                if (current == this) active.clear();
            });
            dialog.setOnShowListener(d -> {
                android.view.Window window = dialog.getWindow();
                if (window != null) {
                    window.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                    window.setLayout(dp(820), dp(520));
                    window.addFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);
                    window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                            | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                            | View.SYSTEM_UI_FLAG_LOW_PROFILE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                }
            });
            dialog.show();
            rebuild(true);'''
          if old_dialog not in s:
              raise SystemExit('saved dialog anchor missing')
          s = s.replace(old_dialog, new_dialog)

          s = replace_method(s,
              '        private void showEditDelete(PlaceRepository.Place place) {',
              '        private void confirmDelete(PlaceRepository.Place place) {',
'''        private void showEditDelete(PlaceRepository.Place place) {
            String[] actions = {"تعديل الموقع", "حذف الموقع"};
            DarbakChoiceDialog.show(activity, place.name,
                    "إدارة الموقع المحفوظ", actions, which -> {
                        if (which == 0) PointEditor.show(activity, place.latitude, place.longitude, place);
                        else confirmDelete(place);
                    });
        }''', 'saved edit/delete')

          s = replace_method(s,
              '        private void confirmDelete(PlaceRepository.Place place) {',
              '    }\n\n    private static final class PlacesAdapter',
'''        private void confirmDelete(PlaceRepository.Place place) {
            DarbakConfirmDialog.show(activity, "حذف الموقع؟", place.name,
                    "حذف", true, () -> {
                        try {
                            if (!repository.delete(place.id)) throw new IllegalStateException("الموقع لم يعد موجودًا");
                            MapRuntimeBridge.refreshSavedPlaces(activity);
                            rebuild(true);
                            DarbakConfirmDialog.show(activity, "تم حذف الموقع",
                                    "يمكن التراجع الآن دون تغيير الإحداثيات أو الأيقونة.",
                                    "تراجع", false, () -> {
                                        try {
                                            repository.restore(place);
                                            MapRuntimeBridge.refreshSavedPlaces(activity);
                                            rebuild(true);
                                        } catch (RuntimeException error) {
                                            Toast.makeText(activity, "تعذر التراجع عن الحذف", Toast.LENGTH_SHORT).show();
                                        }
                                    });
                        } catch (RuntimeException error) {
                            Toast.makeText(activity,
                                    error.getMessage() == null ? "تعذر حذف الموقع" : error.getMessage(),
                                    Toast.LENGTH_LONG).show();
                        }
                    });
        }
    }

    private static final class PlacesAdapter''', 'saved delete')
          p.write_text(s)

          print('Unified Darbak interaction panels applied')
          PY
      - name: Static identity acceptance
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "57, 169, 255" app/src/main/java app/src/main/res || (echo 'legacy blue still present' && exit 1)
          ! grep -R "#39A9FF" app/src/main/java app/src/main/res || (echo 'legacy blue hex still present' && exit 1)
          ! grep -q "new Spinner" app/src/main/java/com/abosultan/darbakmaps/PointEditor.java
          ! grep -q "LinearLayout sidePanel" app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java
          grep -q "DarbakChoiceDialog" app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          grep -q "DarbakConfirmDialog" app/src/main/java/com/abosultan/darbakmaps/SavedPlacesDialog.java
      - name: Tests and compile
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit unified panels
        run: |
          git config user.name 'Darbak CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java app/src/main/res
          git diff --cached --quiet && exit 0
          git commit -m 'ui: unify search saved-place and map interaction panels'
          git push origin HEAD:darbakmaps-review-0.9.1
