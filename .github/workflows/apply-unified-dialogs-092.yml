name: Apply unified Darbak interaction panels
on:
  push:
    branches: [darbakmaps-review-0.9.1]
    paths:
      - '.github/workflows/apply-unified-dialogs-092.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-review-0.9.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply UI patch
        run: python3 .github/scripts/apply_ui_unify_092.py
      - name: Report identity leftovers
        shell: bash
        run: |
          echo '--- legacy rgb references ---'
          grep -R -n "57, 169, 255" app/src/main/java app/src/main/res || true
          echo '--- legacy blue hex references ---'
          grep -R -n "#39A9FF" app/src/main/java app/src/main/res || true
          echo '--- forbidden legacy widgets ---'
          grep -n "new Spinner" app/src/main/java/com/abosultan/darbakmaps/PointEditor.java || true
          grep -n "LinearLayout sidePanel" app/src/main/java/com/abosultan/darbakmaps/CarScreenLayout.java || true
          grep -q "DarbakChoiceDialog" app/src/main/java/com/abosultan/darbakmaps/MainActivity.java
          grep -q "DarbakConfirmDialog" app/src/main/java/com/abosultan/darbakmaps/SavedPlacesDialog.java
      - name: Tests and compile
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit unified panels
        run: |
          git config user.name 'Darbak CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java app/src/main/res
          git diff --cached --quiet && exit 0
          git commit -m 'ui: unify search saved-place and map interaction panels'
          git push origin HEAD:darbakmaps-review-0.9.1
