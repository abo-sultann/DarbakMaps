name: Apply review migration and search UI patch
on:
  push:
    branches: [darbakmaps-final-0.8.0]
    paths:
      - 'tools/apply_review_followup_patch.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: darbakmaps-final-0.8.0
          fetch-depth: 0
      - run: python3 tools/apply_review_followup_patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugJavaWithJavac
      - run: |
          git config user.name 'Darbak Review CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/abosultan/darbakmaps/MainActivity.java app/src/main/java/com/abosultan/darbakmaps/DarbakPanels.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: expose legacy data migration and partial search state'
          git push origin HEAD:darbakmaps-final-0.8.0
