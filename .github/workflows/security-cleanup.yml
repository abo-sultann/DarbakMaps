name: Darbak Security Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove exposed private map source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view darbak-map-source >/dev/null 2>&1; then
            gh release delete darbak-map-source --yes --cleanup-tag
          fi
