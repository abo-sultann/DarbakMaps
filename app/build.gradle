plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abosultan.darbakmaps'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abosultan.darbakmaps'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '0.5.1'

        buildConfigField 'String', 'ACTIVATION_URL', '""'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"https://docs.google.com/document/d/1H8Rg6wBe3XJTZhxuoBH67n_1GlHX8X2WwJij9bsus9s/export?format=txt"'
    }

    signingConfigs {
        production {
            def storePath = System.getenv('DARBAK_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('DARBAK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DARBAK_KEY_ALIAS')
                keyPassword System.getenv('DARBAK_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'boolean', 'ALLOW_DEVELOPMENT_ACCESS', 'true'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.production
            buildConfigField 'boolean', 'ALLOW_DEVELOPMENT_ACCESS', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'

    def mapsforgeVersion = '0.30.0'
    implementation "com.github.mapsforge.mapsforge:mapsforge-core:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-reader:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-android:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-themes:${mapsforgeVersion}@jar"
    implementation 'com.caverock:androidsvg:1.4'

    testImplementation 'junit:junit:4.13.2'
}
