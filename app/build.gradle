plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abosultan.darbakmaps'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abosultan.darbakmaps'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '0.7.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'ACTIVATION_URL', '""'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', '""'
    }

    signingConfigs {
        production {
            def storePath = System.getenv('DARBAK_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('DARBAK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DARBAK_KEY_ALIAS')
                keyPassword System.getenv('DARBAK_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.production
            buildConfigField 'boolean', 'ALLOW_DEVELOPMENT_ACCESS', 'true'
            buildConfigField 'String', 'UPDATE_MANIFEST_URL', '"https://raw.githubusercontent.com/abo-sultann/DarbakMaps/main/update-manifest-debug.json"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.production
            buildConfigField 'boolean', 'ALLOW_DEVELOPMENT_ACCESS', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Isolated emulator package. Never distributed or used to update the owner's app.
    if (project.hasProperty('darbakQa')) {
        buildTypes {
            qa {
                initWith debug
                applicationIdSuffix '.qa'
                versionNameSuffix '-qa'
                signingConfig signingConfigs.debug
                matchingFallbacks = ['debug']
                buildConfigField 'String', 'UPDATE_MANIFEST_URL', '""'
            }
        }
        testBuildType 'qa'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'

    def mapsforgeVersion = '0.30.0'
    implementation "com.github.mapsforge.mapsforge:mapsforge-core:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-reader:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-map-android:${mapsforgeVersion}@jar"
    implementation "com.github.mapsforge.mapsforge:mapsforge-themes:${mapsforgeVersion}@jar"
    implementation 'com.caverock:androidsvg:1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
