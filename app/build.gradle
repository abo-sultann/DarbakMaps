plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abosultan.darbakmaps'
    compileSdk 35

    defaultConfig {
        // Keep the installed-package identity while the clean rebuild is developed.
        applicationId 'com.abosultan.darbakmaps.debug'
        minSdk 25
        targetSdk 35
        versionCode 100
        versionName '1.0.0-rebuild-dev'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Mapsforge 0.30.0 source is approved for the offline engine, but its runtime
    // artifacts are not yet available from our configured repositories. Keep CI
    // green until we vendor/pin a verified binary instead of shipping a broken build.
    testImplementation 'junit:junit:4.13.2'
}
