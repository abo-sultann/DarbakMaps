plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abosultan.darbakmaps'
    compileSdk 35

    defaultConfig {
        // Keep the installed-package identity while the clean rebuild is developed.
        applicationId 'com.abosultan.darbakmaps.debug'
        minSdk 25
        targetSdk 35
        versionCode 100
        versionName '1.0.0-rebuild-dev'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Pinned together: Android renderer + built-in offline render themes.
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
    testImplementation 'junit:junit:4.13.2'
}
